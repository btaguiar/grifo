[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grifo"
version = "0.1.0"
description = "Chatbot RAG educacional que responde dúvidas de alunos citando o material do curso"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Bruno" }]

dependencies = [
    # Orquestração
    "langchain>=1.3.9,<2",
    "langchain-core>=1.2.31,<2",
    "langchain-openai>=1.1.14,<2",
    "langchain-qdrant>=1.0,<2",
    "langchain-text-splitters>=1.1.2,<2",
    # Vector store e busca
    "qdrant-client>=1.12,<1.13",   # casado com a imagem do compose (ver docker-compose.yml)
    "rank-bm25>=0.2.2,<0.3",
    # <4 prendia transformers em 4.x, que carrega RCEs no caminho de
    # from_pretrained. Nao alcancaveis aqui (modelo fixo, sem treino), mas o teto
    # nao tinha motivo tecnico. Vetores conferidos identicos apos a subida.
    "sentence-transformers>=5.1,<6",   # cross-encoder do reranker
    # Transitiva do sentence-transformers, declarada aqui pelo mesmo motivo do
    # starlette: a lib aceita transformers 4.x, que tem RCE aberto.
    "transformers>=5.10,<6",
    # Ingestão
    "pypdf>=6.16.1,<7",   # <6 travava ~24 avisos de seguranca; PDF e entrada nao confiavel
    "webvtt-py>=0.5,<0.6",
    # API e UI
    "fastapi>=0.141,<0.142",
    # Transitiva do fastapi, declarada aqui de proposito: o fastapi so pede
    # `starlette>=0.46`, e a 0.46 carrega avisos de seguranca abertos.
    "starlette>=1.3.1,<2",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "streamlit>=1.39,<2",
    # Utilidades
    "python-dotenv>=1.0,<2",
    "tiktoken>=0.8,<0.9",
    "httpx>=0.27,<0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-cov>=5.0,<7",
    "pytest-asyncio>=1.0,<2",
    "ruff>=0.7,<0.13",
    "mypy>=1.13,<2",
    "pip-audit>=2.10,<3",
]
eval = [
    # <0.3 importava `langchain_community.chat_models.vertexai`, que sumiu no
    # langchain 1.x -- e o ImportError virava "RAGAS nao instalado" no relatorio.
    "ragas>=0.4,<0.5",
    # O ragas 0.4.3 AINDA importa aquele modulo, e o langchain-community 0.4 (que
    # esta sendo descontinuado) ja o removeu. Segurar em 0.3.x e o que faz o ragas
    # carregar. So o extra `eval` paga isso: o runtime nao instala community.
    "langchain-community>=0.3,<0.4",
    "datasets>=5.0.1,<6",
    "pandas>=2.2,<3",
    "matplotlib>=3.9,<4",
]

[project.scripts]
grifo-ingest = "grifo.ingest.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
grifo = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "eval"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Literais de prosa do gerador de rascunhos: os casos de calibração são textos
# corridos por questões de revisabilidade -- quebrá-los em concatenação implícita
# piora a leitura do que está sendo rotulado.
"eval/gerar_rascunhos_calibracao.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `pytest` puro roda so o que nao precisa de servico externo -- e o que o README
# promete. `pytest -m integration` sobrescreve e roda os que exigem Qdrant.
addopts = "-q --strict-markers -m 'not integration'"
markers = [
    "integration: exige serviços externos (Qdrant, OpenAI)",
]

[tool.coverage.run]
source = ["src/grifo"]

[tool.mypy]
python_version = "3.12"
packages = ["grifo"]
ignore_missing_imports = true
