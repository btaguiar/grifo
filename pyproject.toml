[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grifo"
version = "0.1.0"
description = "Chatbot RAG educacional que responde dúvidas de alunos citando o material do curso"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Bruno" }]

dependencies = [
    # Orquestração
    "langchain>=0.3,<0.4",
    "langchain-core>=0.3,<0.4",
    "langchain-openai>=0.2,<0.3",
    "langchain-qdrant>=0.2,<0.3",
    "langchain-text-splitters>=0.3,<0.4",
    # Vector store e busca
    "qdrant-client>=1.12,<2",
    "rank-bm25>=0.2.2,<0.3",
    "sentence-transformers>=3.0,<4",   # cross-encoder do reranker
    # Ingestão
    "pypdf>=5.0,<6",
    "webvtt-py>=0.5,<0.6",
    # API e UI
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "streamlit>=1.39,<2",
    # Utilidades
    "python-dotenv>=1.0,<2",
    "tiktoken>=0.8,<0.9",
    "httpx>=0.27,<0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5.0,<7",
    "pytest-asyncio>=0.24,<0.26",
    "ruff>=0.7,<0.13",
    "mypy>=1.13,<2",
]
eval = [
    "ragas>=0.2,<0.3",
    "datasets>=3.0,<4",
    "pandas>=2.2,<3",
    "matplotlib>=3.9,<4",
]

[project.scripts]
grifo-ingest = "grifo.ingest.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
grifo = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "eval"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: exige serviços externos (Qdrant, OpenAI)",
]

[tool.coverage.run]
source = ["src/grifo"]

[tool.mypy]
python_version = "3.12"
packages = ["grifo"]
ignore_missing_imports = true
