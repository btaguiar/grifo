services:
  qdrant:
    # Casado com o pin do qdrant-client no pyproject: o cliente recusa diferenca de
    # minor maior que 1. Subir esta imagem exige subir o pin junto -- e recriar o
    # volume, porque 1.19 nao le o storage escrito por 1.12 (panic no boot, variante
    # `on_disk` do segment.json). Medido em 2026-09-02.
    image: qdrant/qdrant:v1.12.4
    container_name: grifo-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      # Volume NOMEADO, nao bind mount para o disco do host. Com
      # `./qdrant_storage:/qdrant/storage` no Windows, todo restart do container
      # devolvia a colecao com o payload intacto e os VETORES ZERADOS: o texto
      # continuava la, todo cosseno dava 0.0, o gate do FR-24 recusava tudo e
      # nenhum erro aparecia. Aconteceu tres vezes em 2026-09-24 antes de virar
      # hipotese testada: o payload vive no RocksDB (escrita direta) e os vetores
      # em arquivos mapeados em memoria, que nao sobrevivem ao bind mount do
      # Docker Desktop. Com volume nomeado sobreviveu a restart e a stop+start.
      - qdrant_dados:/qdrant/storage
    # Sem healthcheck de propósito: a imagem do Qdrant não traz curl nem wget, e o
    # truque com /dev/tcp depende de bash estar lá. Se não estiver, o healthcheck
    # nunca passa e a `api` fica presa esperando para sempre — falha silenciosa pior
    # que o problema que resolveria. O Qdrant sobe em ~2s, e a API se declara
    # degradada com 503 no /health enquanto ele não responde (FR-41).

  api:
    build:
      context: .
      target: runtime
    container_name: grifo-api
    command: uvicorn grifo.api.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      # LLM/embeddings na SUA maquina: dentro do container, 127.0.0.1 e o proprio
      # container. Nao existe valor unico que sirva aos dois lados (host.docker.internal
      # nao resolve no host), entao o .env guarda o endereco de fora e
      # OPENAI_BASE_URL_DOCKER, quando definido, vale so aqui dentro. Quem usa provedor
      # remoto nao define nada e mantem o valor do .env.
      OPENAI_BASE_URL: ${OPENAI_BASE_URL_DOCKER:-${OPENAI_BASE_URL:-}}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - ./samples:/app/samples:ro
      - ./data:/app/data
      # Sem isto, todo container novo rebaixa ~458MB do modelo de embedding antes de
      # servir a primeira pergunta.
      - hf-cache:/root/.cache/huggingface
    depends_on:
      - qdrant

  # Ingestao sob demanda, no MESMO ambiente da api -- quem clonou o repo nao precisa
  # ter Python nem as dependencias na maquina:
  #     docker compose run --rm ingest
  ingest:
    build:
      context: .
      target: runtime
    profiles: ["tools"]
    command: python -m grifo.ingest samples/
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      OPENAI_BASE_URL: ${OPENAI_BASE_URL_DOCKER:-${OPENAI_BASE_URL:-}}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./samples:/app/samples:ro
      - ./data:/app/data
      - hf-cache:/root/.cache/huggingface
    depends_on:
      - qdrant

volumes:
  qdrant_dados:
  hf-cache:
